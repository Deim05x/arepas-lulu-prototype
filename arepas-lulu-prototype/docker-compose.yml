services:
  mariadb:
    image: mariadb:12.3.3
    container_name: arepas-lulu-db
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-arepas_lulu}
      MARIADB_USER: ${MARIADB_USER:-arepas}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-arepas_dev}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_dev}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: arepas-lulu-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-arepas_lulu}
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-arepas}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-arepas_dev}
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: arepas-lulu-web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
